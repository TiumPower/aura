upstream puma_aura {
  server unix:/var/www/aura/shared/tmp/sockets/puma.sock fail_timeout=0;
}

# Redirect HTTP → HTTPS (apex + all shop subdomains)
server {
  listen 80;
  server_name aura.czin.net *.aura.czin.net;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  # Apex (super-admin, merchant, /w/:slug) + wildcard shop subdomains (white-label PWA)
  server_name aura.czin.net *.aura.czin.net;

  # SSL — managed by Certbot.
  #   Apex-only cert works for aura.czin.net; for valid TLS on shop
  #   subdomains install a wildcard cert (*.aura.czin.net via DNS-01) and
  #   point the two lines below at it.
  ssl_certificate     /etc/letsencrypt/live/aura-wildcard/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/aura-wildcard/privkey.pem;
  include             /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

  root /var/www/aura/current/public;

  add_header X-Frame-Options        SAMEORIGIN;
  add_header X-Content-Type-Options nosniff;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Video tham quan 3D/VR do chủ nhà quay bằng điện thoại dễ vượt 100MB; 20M
  # cũ khiến nginx cắt kết nối trước khi Rails kịp thấy tệp.
  client_max_body_size 320M;
  # Mạng nhà ở VN upload chậm — 60s mặc định ngắt giữa chừng một video dài.
  client_body_timeout 300s;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml application/manifest+json;
  gzip_min_length 1000;

  location ^~ /assets/ {
    gzip_static on;
    expires 1y;
    add_header Cache-Control public;
    break;
  }

  location ^~ /rails/active_storage/ {
    proxy_pass         http://puma_aura;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  # Sidekiq Web UI (protect behind app auth if mounted)
  location @puma {
    proxy_pass         http://puma_aura;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_redirect     off;
    proxy_read_timeout 300s;
  }

  try_files $uri @puma;
}
