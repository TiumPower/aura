upstream puma_aura {
  server unix:/var/www/aura/shared/tmp/sockets/puma.sock fail_timeout=0;
}

# Redirect HTTP → HTTPS (apex + all shop subdomains)
server {
  listen 80;
  server_name aura.tiumpower.com *.aura.tiumpower.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  # Apex (super-admin, merchant, /w/:slug) + wildcard shop subdomains (white-label PWA)
  server_name aura.tiumpower.com *.aura.tiumpower.com;

  # SSL — managed by Certbot.
  #   Apex-only cert works for aura.tiumpower.com; for valid TLS on shop
  #   subdomains install a wildcard cert (*.aura.tiumpower.com via DNS-01) and
  #   point the two lines below at it.
  ssl_certificate     /etc/letsencrypt/live/aura-tiumpower/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/aura-tiumpower/privkey.pem;
  include             /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

  root /var/www/aura/current/public;

  add_header X-Frame-Options        SAMEORIGIN;
  add_header X-Content-Type-Options nosniff;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  # Sản phẩm chưa mở công khai: cấm mọi công cụ tìm kiếm lập chỉ mục.
  # Đi kèm public/robots.txt vẫn CHO Googlebot tải, vì bị chặn tải thì nó
  # không đọc được noindex và URL đã index sẽ nằm lại vĩnh viễn.
  # XOÁ 2 CHỖ (server + location /assets/) khi muốn mở công khai.
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

  # Ảnh tiến trình điều trị chụp bằng điện thoại (nhiều ảnh một lượt) dễ vượt
  # 20M mặc định; nginx sẽ cắt kết nối trước khi Rails kịp thấy tệp.
  client_max_body_size 120M;
  # Mạng 4G ở tiệm upload chậm — 60s mặc định ngắt giữa chừng một lượt nhiều ảnh.
  client_body_timeout 300s;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml application/manifest+json;
  gzip_min_length 1000;

  location ^~ /assets/ {
    gzip_static on;
    expires 1y;
    add_header Cache-Control public;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    break;
  }

  location ^~ /rails/active_storage/ {
    proxy_pass         http://puma_aura;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  # ActionCable. KHÔNG có block này thì WebSocket thất bại ÂM THẦM: chat và
  # badge realtime chỉ cập nhật khi tải lại trang, trang vẫn chạy bình thường
  # nên rất lâu mới phát hiện (bài học từ estate và xstudio).
  location ^~ /cable {
    proxy_pass          http://puma_aura;
    proxy_http_version  1.1;
    proxy_set_header    Upgrade $http_upgrade;
    proxy_set_header    Connection "upgrade";
    proxy_set_header    Host $host;
    proxy_set_header    X-Real-IP $remote_addr;
    proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
  }

  location @puma {
    proxy_pass         http://puma_aura;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_redirect     off;
    proxy_read_timeout 300s;
  }

  try_files $uri @puma;
}
